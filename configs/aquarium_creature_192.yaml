project:
  name: aquarium_creature

dataset:
  root: data/aquarium_creature
  train_split: train
  validation_split: val
  classes:
    - creature
  class_mode: merge_single
  merged_class_name: creature

model:
  backbone: mobilenet_v2_lite
  width_multiplier: 0.35
  head_channels: 32
  input_size: 192
  output_stride: 8

loss:
  name: focal_cross_entropy
  gamma: 2.0
  class_weights:
    - 1.0
    - 1.0

training:
  device: auto
  amp: true
  num_workers: 4
  pin_memory: true
  batch_size: 16
  epochs: 50
  seed: 42
  output_dir: outputs/aquarium_creature
  resume: null
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    name: step_lr
    step_size: 10
    gamma: 0.5

export:
  onnx_opset: 17
  input_size: 192
