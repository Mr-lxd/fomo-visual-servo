project:
  name: aquarium_pretrain_7class

dataset:
  root: "${FOMO_DATASET_ROOT}"
  train_split: train
  validation_split: val
  classes:
    - fish
    - jellyfish
    - penguin
    - puffin
    - shark
    - starfish
    - stingray
  class_mode: preserve
  collision_policy: keep_first

postprocess:
  confidence_threshold: 0.05
  class_thresholds: null
  component_mode: connected_components
  confidence_mode: max
  selection_strategy: highest_confidence
  max_match_distance_pixels: 32.0
  max_lost_frames: 5
  allowed_class_ids: null

evaluation:
  matching_mode: centroid_in_bbox
  max_distance_pixels: 32.0
  threshold_sweep: [0.05, 0.10, 0.20, 0.30, 0.50, 0.70, 0.90, 0.95]

model:
  backbone: mobilenet_v2_lite
  width_multiplier: 0.35
  head_channels: 32
  input_size: 192
  output_stride: 8

loss:
  name: focal_cross_entropy
  gamma: 2.0
  class_weights:
    - 1.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0

training:
  device: auto
  amp: true
  amp_initial_scale: 256.0
  num_workers: 4
  pin_memory: true
  batch_size: 8
  epochs: 100
  seed: 42
  output_dir: outputs/aquarium_pretrain_7class_192
  resume: null
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0
  checkpoint_criterion: grid_f1
  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    name: step_lr
    step_size: 20
    gamma: 0.5

export:
  onnx_opset: 17
  input_size: 192
