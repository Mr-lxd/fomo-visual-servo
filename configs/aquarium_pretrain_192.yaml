project:
  name: aquarium_pretrain_7class

dataset:
  root: "${FOMO_DATASET_ROOT}"
  train_split: train
  validation_split: val
  classes:
    - fish
    - jellyfish
    - penguin
    - puffin
    - shark
    - starfish
    - stingray
  class_mode: preserve
  collision_policy: keep_first

model:
  backbone: mobilenet_v2_lite
  width_multiplier: 0.35
  head_channels: 32
  input_size: 192
  output_stride: 8

loss:
  name: focal_cross_entropy
  gamma: 2.0
  class_weights:
    - 1.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0

training:
  device: auto
  amp: true
  amp_initial_scale: 256.0
  num_workers: 4
  pin_memory: true
  batch_size: 8
  epochs: 100
  seed: 42
  output_dir: outputs/aquarium_pretrain_7class_192
  resume: null
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0
  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    name: step_lr
    step_size: 20
    gamma: 0.5

export:
  onnx_opset: 17
  input_size: 192
