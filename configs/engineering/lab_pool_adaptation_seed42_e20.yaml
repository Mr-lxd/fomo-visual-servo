project:
  name: lab_pool_adaptation_seed42_e20

dataset:
  root: "${FOMO_LAB_POOL_TRAIN_ROOT}"
  train_split: train
  validation_split: null
  classes:
    - fish
    - jellyfish
    - penguin
    - puffin
    - shark
    - starfish
    - stingray
  class_mode: preserve
  collision_policy: keep_first

postprocess:
  inference_threshold: 0.40
  class_thresholds: null
  component_mode: connected_components
  confidence_mode: max
  selection_strategy: highest_confidence
  max_match_distance_pixels: 32.0
  max_lost_frames: 5
  allowed_class_ids: null

evaluation:
  matching_mode: centroid_in_bbox
  max_distance_pixels: 32.0
  checkpoint_threshold: 0.40
  threshold_sweep:
    enabled: false
    minimum: 0.40
    maximum: 0.40
    step: 0.05
  checkpoint_selection:
    metric: centroid_pr_auc_macro
    split: val
  threshold_calibration:
    enabled: false
    split: calibration
    objective: centroid_f1
    fallback_threshold: 0.40
    allow_selection_split: false

model:
  backbone: mobilenet_v2_fomo
  width_multiplier: 0.35
  head_channels: 32
  input_size: 192
  output_stride: 8
  pretrained: false

augmentation:
  enabled: true
  preset: underwater_conservative
  overrides: {}

loss:
  type: ei_weighted_xent_legacy
  gamma: 0.0
  background_weight: 1.0
  object_weight: 100.0

training:
  device: cuda
  amp: true
  amp_initial_scale: 256.0
  num_workers: 4
  pin_memory: true
  batch_size: 8
  epochs: 20
  seed: 42
  output_dir: outputs/engineering/lab_pool_adaptation_seed42_e20
  resume: null
  initialize_from: "${FOMO_D2_EPOCH40_WEIGHTS}"
  initialize_sha256: e8c242f4af2b87b70fea2a516352f28e70bf438161eeb7d092231ed46c976a1d
  checkpoint_policy: fixed_final_epoch
  early_stopping_patience: 0
  early_stopping_min_delta: 0.0
  checkpoint_criterion: centroid_f1
  epoch_snapshots:
    enabled: true
    format: weights_only
    interval: 20
    keep_last: 1
  optimizer:
    name: adamw
    learning_rate: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: none
    step_size: 1
    gamma: 1.0

export:
  onnx_opset: 17
  input_size: 192

experiment:
  name: lab_pool_adaptation_seed42_e20
  summary_csv: outputs/engineering/experiments_summary.csv
